enabled: true
position: 'bottom'
max_queries: 100
storage:
  enabled: true
  driver: 'file'
  path: '/tmp/debugbar'
collectors:
  - 'time'
  - 'memory'
  - 'exceptions'
  - 'pdo'
  - 'request'
  - 'config'
  - 'messages'
collector_map:
  custom: 'My\\Custom\\Collector'
exclude_paths:
  - '/health'
  - '/metrics'
