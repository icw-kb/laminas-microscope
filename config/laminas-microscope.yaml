laminas_microscope:
  # Global settings
  enabled: true
  environment: 'development'  # development, staging, production
  
  # Storage settings
  storage:
    path: '/tmp/laminas-microscope'
    
  # Component configuration
  components:
    whoops:
      enabled: true
      show_in_production: false
      editor: 'vscode'  # vscode, phpstorm, sublime
      page_title: 'Application Error'
      
    debug_bar:
      enabled: true
      position: 'bottom'  # bottom, top
      max_queries: 100
      collectors_only: false
      collectors:
        - 'time'
        - 'memory'
        - 'exceptions'
        - 'pdo'
        - 'request'
        - 'config'
        
    microscope:
      enabled: true
      auto_analyze: true
      checks:
        n_plus_one: true
        unused_routes: true
        unused_views: true
        slow_queries: true
        large_responses: true
        duplicate_queries: true
      thresholds:
        query_time: 100  # milliseconds
        response_size: 1048576  # bytes (1MB)
        duplicate_query_threshold: 3
      reporting:
        log_level: 'warning'
        email_alerts: false
        webhook_url: null
      analysis:
        store_reports: true
        retention_days: 30
        
  # Database profiling
  database:
    log_queries: true
    explain_queries: true
    highlight_slow_queries: true
    
  # Security
  ip_whitelist: []  # Empty means all IPs allowed in development
  
  # Performance
  cache_enabled: true
  cache_ttl: 3600
